services:

  # ── 1. FastAPI Backend ────────────────────────────────────────────────────
  - type: web
    name: aldi-meal-planner-api
    runtime: python
    region: frankfurt          # closest to Aldi Süd's target users (Germany)
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false            # set manually in Render dashboard — never committed
      - key: USDA_API_KEY
        sync: false            # set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        # Set this to your frontend URL after the static site is created.
        # Example: https://aldi-meal-planner.onrender.com
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── 2. React Frontend (Static Site) ──────────────────────────────────────
  - type: web
    name: aldi-meal-planner
    runtime: static
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      # Cache hashed JS/CSS assets for 1 year; HTML never cached (SPA routing)
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /
        name: Cache-Control
        value: no-cache
    routes:
      # Send all routes to index.html for client-side React Router
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        # Set this to your backend service URL after it is deployed.
        # Example: https://aldi-meal-planner-api.onrender.com
        sync: false
